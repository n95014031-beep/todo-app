[project]
name = "todo-flet-supabase"
version = "1.0.0"
description = "Учебное приложение Список задач"
requires-python = ">=3.11"
dependencies = [
    "flet==0.28.3",
    "supabase==2.15.1",
]

[tool.flet]
app.name = "Список задач"
app.bundle_id = "com.student.todo"
app.version = "1.0.0"

[tool.flet.app]
exclude = [".venv", "build", ".git", ".github", "__pycache__"]